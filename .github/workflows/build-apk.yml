name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -e
          java -version
          echo "JAVA_HOME=${JAVA_HOME}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set. Java 17 setup failed."
            exit 1
          fi
          JAVA_VERSION_LINE=$(java -version 2>&1 | head -n 1)
          echo "java -version output: ${JAVA_VERSION_LINE}"
          # Extract major version (handles both "17.x" and legacy "1.8.x" formats)
          RAW_VERSION=$(echo "${JAVA_VERSION_LINE}" | sed -n 's/.* version "\([^"]*\)".*/\1/p')
          echo "Detected java version string: ${RAW_VERSION}"
          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::Could not determine Java version from 'java -version' output."
            exit 1
          fi
          if echo "${RAW_VERSION}" | grep -q '^1\.'; then
            MAJOR_VERSION=$(echo "${RAW_VERSION}" | cut -d'.' -f2)
          else
            MAJOR_VERSION=$(echo "${RAW_VERSION}" | cut -d'.' -f1)
          fi
          echo "Active Java major version: ${MAJOR_VERSION}"
          if [ "${MAJOR_VERSION}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but found major version ${MAJOR_VERSION} (${RAW_VERSION})."
            exit 1
          fi
          echo "Java environment OK (17 or newer)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          set -e
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "${KEYSTORE_PATH}" ]; then
            echo "debug.keystore already exists, skipping generation."
          else
            echo "debug.keystore not found, generating temporary debug keystore with Java 17 keytool..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_PATH}" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          if [ ! -f "${KEYSTORE_PATH}" ]; then
            echo "::error::Failed to create ./debug.keystore. Keystore generation failed."
            exit 1
          fi
          echo "Temporary debug keystore ready at ./debug.keystore."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK exists
        run: |
          set -e
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "${APK_PATH}" ]; then
            echo "Found debug APK at ${APK_PATH}"
            ls -lh "${APK_PATH}"
          else
            echo "::error::Expected debug APK not found at ${APK_PATH}."
            echo "Searching only inside app/build/outputs/apk ..."
            find app/build/outputs/apk -type f -name "*.apk" -print || true
            echo "::error::No debug APK exists at ${APK_PATH}. Failing without uploading an unrelated APK."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
